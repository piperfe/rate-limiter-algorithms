[package]
name = "rate_limiter"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
futures = "0.3.33"
envy = "0.4"
serde = { version = "1.0", features = ["derive"] }
axum-macros = "0.5"
dashmap = "5.5"

[dev-dependencies]
axum-test = "21"
temp-env = { version = "0.3", features = ["async_closure"] }
